      - slug: scraper-default-cli-feature
        title: scraper's default CLI feature pulls an unused argument parser
        criterion: "7.3"
        surface: Supply Chain
        concern: advisory
        locations:
          - path: Cargo.toml
            start_line: 15
            end_line: 15
        evidence: |-
          scraper = "0.22"
        evidence_lang: toml
        evidence_markers:
          - lines: "1"
            type: mark
            label: Default features remain enabled
        mechanism: |
          scraper 0.22.0 enables its main feature by default, bringing `getopts` and
          `unicode-width` into the graph for scraper's standalone executable. fte uses only library
