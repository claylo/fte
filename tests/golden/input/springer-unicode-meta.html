<section>
<h2>Abstract</h2>
<p>This study examines the magnetic properties of <b>α-Fe₂O₃</b> (hematite) and <b>γ-Fe₂O₃</b> (maghemite) nanoparticles synthesized via co-precipitation.</p>
</section>
<section>
<h2>Results</h2>
<p>Mössbauer spectroscopy confirmed the phase purity. The Néel temperature T<sub>N</sub> = 948 K for α-Fe₂O₃ agreed with literature values within ±2 K.</p>
