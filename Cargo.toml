[package]
name = "fte"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Extract clean markdown from publisher HTML/XML/ePub academic papers"
publish = false

[dependencies]
anyhow = "1.0"
librebar = { version = "0.6", default-features = false, features = ["cli", "config"] }
roxmltree = "0.21"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
diff = "0.1.13"
