[package]
name = "fte"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Extract clean markdown from publisher HTML/XML/ePub academic papers"
keywords = ["markdown", "epub", "extraction", "academic", "papers"]
categories = ["command-line-utilities", "text-processing"]
repository = "https://github.com/claylo/fte"
homepage = "https://github.com/claylo/fte"
readme = "README.md"

[dependencies]
anyhow = "1.0"
librebar = { version = "0.6", default-features = false, features = ["cli", "config"] }
roxmltree = "0.21"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.2"
diff = "0.1.13"
predicates = "3.1"
sha2 = "0.11"
tempfile = "3.27"
